services:
  - type: web
    name: stocklens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FUYAO_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
